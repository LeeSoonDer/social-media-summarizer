<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Social Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #161616;
      background: #f7f7f4;
    }
    h1 { font-size: 14px; margin-bottom: 6px; }
    p { font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 10px; }
    button {
      width: 100%;
      border: 1px solid #202124;
      background: #202124;
      color: #fff;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    #msg { margin-top: 8px; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Social Extractor</h1>
  <p>主界面已经搬到右侧工作台。点击扩展图标就会直接打开侧栏。</p>
  <button id="open">打开侧栏工作台</button>
  <p id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
