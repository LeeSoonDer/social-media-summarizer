<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Extractor 工作台</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="platformBadge" class="badge">未识别</span>
      <span id="pageHost" class="host" title="">等待页面</span>
    </div>
    <button id="refresh" class="ghost" title="重新采集当前页">刷新</button>
  </header>

  <p id="status" class="status loading">正在提取页面内容…</p>
  <div id="staleBanner" class="banner" hidden>当前标签页已变化 · 点「刷新」重新采集</div>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="page" role="tab">本页</button>
    <button class="tab" data-tab="ocr" role="tab">画面</button>
    <button class="tab" data-tab="stt" role="tab">口播</button>
    <button class="tab" data-tab="collection" role="tab">集合</button>
    <button class="tab" data-tab="notes" role="tab">笔记</button>
  </nav>

  <main>
    <!-- 本页 -->
    <section id="panel-page" class="panel is-active">
      <button id="hasNotes" class="note-flag" hidden>本页已有笔记 · 0</button>
      <div class="pills">
        <span class="pill" id="pillText">正文 —</span>
        <span class="pill" id="pillOcr">画面字 —</span>
        <span class="pill" id="pillImages">图片 0</span>
        <span class="pill" id="pillVideos">视频 0</span>
      </div>
      <div class="field">
        <label>标题</label>
        <div id="pageTitle" class="value">—</div>
      </div>
      <div class="field" id="fieldAuthor" hidden>
        <label>作者</label>
        <div id="pageAuthor" class="value">—</div>
      </div>
      <div class="field">
        <label>链接</label>
        <a id="pageUrl" class="value link" target="_blank" rel="noreferrer noopener">—</a>
      </div>
      <div class="field">
        <label>正文 / Caption</label>
        <div id="pageBody" class="value body">—</div>
      </div>
      <div class="field" id="fieldTags" hidden>
        <label>标签</label>
        <div id="pageTags" class="value tags"></div>
      </div>
      <div class="field" id="fieldMeta" hidden>
        <label>提取说明</label>
        <ul id="pageMeta" class="meta-list"></ul>
      </div>
    </section>

    <!-- 画面 -->
    <section id="panel-ocr" class="panel">
      <div class="row">
        <button id="rescan" class="primary">再扫一屏</button>
        <button id="copyOcr" disabled>复制画面文字</button>
        <button id="resetOcr" class="danger" disabled title="丢掉本页已扫的所有屏，从头再来">清空重扫</button>
      </div>
      <p class="hint">只识别当前视口。<strong>轮播请翻到下一张再扫</strong>，多屏结果会自动合并去重。</p>
      <p class="hint" id="ocrPassCount">本页还没扫过</p>
      <pre id="ocrText" class="mono">—</pre>
    </section>

    <!-- 口播 -->
    <section id="panel-stt" class="panel">
      <div class="row">
        <span class="badge muted" id="sttState">未开始</span>
        <button id="sttStart" disabled title="下一阶段（Phase 5 口播）">开始转写</button>
        <button id="sttStop" disabled>停止</button>
      </div>
      <p class="hint">本地转写引擎尚未接入（Phase 5）。届时需要你手动点开始，不会自动录音。</p>
      <div class="field">
        <label>页面已暴露的字幕</label>
        <pre id="sttTranscript" class="mono">—</pre>
      </div>
      <p class="hint">YouTube 一类平台若有字幕轨道，会直接显示在上面，不需要录音。</p>
    </section>

    <!-- 集合 -->
    <section id="panel-collection" class="panel">
      <div class="row">
        <button id="copyCollection" disabled>复制集合</button>
        <button id="clearCollection" class="danger">清空集合</button>
      </div>
      <p class="hint" id="collectionCount">集合：0 页</p>
      <ul id="collectionList" class="list"></ul>
    </section>

    <!-- 笔记 -->
    <section id="panel-notes" class="panel">
      <textarea id="noteInput" class="note-input" rows="2"
        placeholder="记一句，回车存进收集箱（Shift+Enter 换行）"></textarea>

      <div class="row folder-row">
        <select id="folderSelect" title="看哪个文件夹的笔记"></select>
        <button id="folderNew" title="新建文件夹">新建</button>
        <button id="folderRename" title="给当前文件夹改名">改名</button>
        <button id="folderDelete" class="danger" title="删除当前文件夹，里面的笔记回收集箱">删除</button>
      </div>

      <div id="folderEditor" class="row" hidden>
        <input id="folderName" type="text" maxlength="40" placeholder="文件夹名" />
        <button id="folderSave" class="primary">保存</button>
        <button id="folderCancel">取消</button>
      </div>

      <p id="notesHint" class="hint"></p>

      <h3 class="group-title">本页相关 <span id="relatedCount" class="count">0</span></h3>
      <ul id="relatedNotes" class="list notes"></ul>

      <h3 class="group-title" id="otherTitle">收集箱里的其它笔记</h3>
      <ul id="otherNotes" class="list notes"></ul>
    </section>
  </main>

  <div class="aibar">
    <label class="ai-field">
      稿件
      <select id="aiMode" title="复制给 AI 时用哪一档">
        <option value="lean">瘦身</option>
        <option value="full">全量</option>
      </select>
    </label>
    <label class="ai-check">
      <input type="checkbox" id="withNotes" />
      附带我的笔记
    </label>
    <span id="aiModeHint" class="ai-hint"></span>
  </div>

  <footer class="bottombar">
    <button id="copyPage" class="primary" disabled>复制本页</button>
    <button id="toNote" disabled title="把本页瘦身稿追加到本页笔记">丢进当前笔记</button>
    <button id="copyAi" disabled>复制给 AI</button>
  </footer>

  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="lib/ocr.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/format.js"></script>
  <script src="lib/notes.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
